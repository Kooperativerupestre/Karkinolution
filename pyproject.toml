[project]
name = "karkinolution"
version = "0.1.0"
description = "Development tools for the Karkino project"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.16,<1.0",
]

[project.scripts]
karkinolution = "karkinolution.__main__:app"

[build-system]
requires = ["uv_build>=0.8.0,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-root = "cli/src"