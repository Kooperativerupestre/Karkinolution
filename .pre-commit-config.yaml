repos:
  - repo: local
    hooks:
      - id: karkinolution-style-check
        name: Karkinolution style check
        entry: .venv/bin/karkinolution style check
        language: system
        types: [c++]
        pass_filenames: true

      - id: karkinolution-tidy-check
        name: Karkinolution tidy check
        entry: .venv/bin/karkinolution tidy check
        language: system
        types: [c++]
        pass_filenames: true
