name: Valgrind

on:
  schedule:
    - cron: '0 21 * * *'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: valgrind-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: karkinolution-ci:latest

jobs:
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: gcc15-valgrind
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              -S /workspace \
              -B /workspace/build-valgrind \
              -G Ninja \
              -DCMAKE_C_COMPILER=gcc-15 \
              -DCMAKE_CXX_COMPILER=g++-15 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_GODOT_EXTENSION=OFF

      - name: Build tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              --build /workspace/build-valgrind \
              --target karkinolution_tests \
              --parallel "$(nproc)"

      - name: Run Valgrind
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            ${{ env.DOCKER_IMAGE }} \
            valgrind \
              --leak-check=full \
              --show-leak-kinds=all \
              --track-origins=yes \
              --error-exitcode=1 \
              /workspace/build-valgrind/tests/karkinolution_tests
