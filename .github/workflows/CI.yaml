name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 21 * * *'
      timezone: 'America/Sao_Paulo'
    - cron: '0 */5 * * *'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: karkinolution-ci:latest

jobs:
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Run CLI unit tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e HOME=/tmp \
            ${{ env.DOCKER_IMAGE }} \
            uv run python -m unittest discover -s cli/tests

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # An empty sha means there is no usable base, so tidy checks every file.
      - name: Resolve diff base
        id: diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE_SHA" ;;
            *)            base="" ;;
          esac

          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi

          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang21-tidy
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Build compilation database
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            sh -c 'cmake --preset ci-tidy && cmake --build --preset ci-tidy --parallel "$(nproc)" && ln -sfn build-tidy build && cmake --preset ci-godot && cmake --build --preset ci-godot --parallel "$(nproc)" && ln -sfn build-ci-godot build-godot'

      - name: Run style check
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            ${{ env.DOCKER_IMAGE }} \
            uv run karkinolution style check src main.cpp \
              --style-file /workspace/.clang-format

      - name: Run tidy check
        env:
          DIFF_BASE_SHA: ${{ steps.diff-base.outputs.sha }}
        run: |
          changed_since_args=()
          if [ -n "$DIFF_BASE_SHA" ]; then
            changed_since_args=(--changed-since "$DIFF_BASE_SHA")
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e HOME=/tmp \
            ${{ env.DOCKER_IMAGE }} \
            uv run karkinolution tidy check src main.cpp \
              --config-file /workspace/.clang-tidy \
              "${changed_since_args[@]}"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang21
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake --preset ci


      - name: Build tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake --build --preset ci --parallel "$(nproc)"

      - name: Test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            ctest --preset ci

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang21-asan-ubsan
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake --preset ci-sanitizers


      - name: Build tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake --build --preset ci-sanitizers --parallel "$(nproc)"

      - name: Test with sanitizers
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            ${{ env.DOCKER_IMAGE }} \
            ctest --preset ci-sanitizers

  godot-extension:
    name: Godot Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: godot-clang21
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake --preset ci-godot


      - name: Build Godot extension
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -w /workspace \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake --build --preset ci-godot --parallel "$(nproc)"
