name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 21 * * *'
      timezone: 'America/Sao_Paulo'
    - cron: '0 */5 * * *'
      timezone: 'America/Sao_Paulo'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_IMAGE: karkinolution-ci:latest

jobs:
  cli-tests:
    name: CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Run CLI unit tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e HOME=/tmp \
            ${{ env.DOCKER_IMAGE }} \
            uv run python -m unittest discover -s cli/tests

  style-check:
    name: Style Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Run style check
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e HOME=/tmp \
            ${{ env.DOCKER_IMAGE }} \
            uv run karkinolution style check src/karkinolution main.cpp --style-file /workspace/.clang-format

  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      # An empty sha means there is no usable base, so tidy checks every file.
      - name: Resolve diff base
        id: diff-base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PULL_REQUEST_BASE_SHA" ;;
            push)         base="$PUSH_BEFORE_SHA" ;;
            *)            base="" ;;
          esac

          if [ -n "$base" ] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base=""
          fi

          echo "sha=$base" >> "$GITHUB_OUTPUT"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang21-tidy
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              -S /workspace \
              -B /workspace/build-tidy \
              -G Ninja \
              -DCMAKE_C_COMPILER=clang-21 \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_GODOT_EXTENSION=OFF

      - name: Build
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              --build /workspace/build-tidy \
              --target karkinolution_app \
              --parallel "$(nproc)"

      - name: Run tidy check
        env:
          DIFF_BASE_SHA: ${{ steps.diff-base.outputs.sha }}
        run: |
          changed_since_args=()
          if [ -n "$DIFF_BASE_SHA" ]; then
            changed_since_args=(--changed-since "$DIFF_BASE_SHA")
          fi

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e HOME=/tmp \
            ${{ env.DOCKER_IMAGE }} \
            uv run karkinolution tidy check src/karkinolution main.cpp \
              --build-dir /workspace/build-tidy \
              --config-file /workspace/.clang-tidy \
              "${changed_since_args[@]}"

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang21
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              -S /workspace \
              -B /workspace/build-ci \
              -G Ninja \
              -DCMAKE_C_COMPILER=clang-21 \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_GODOT_EXTENSION=OFF

      - name: Build tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              --build /workspace/build-ci \
              --target karkinolution_tests \
              --target karkinolution_app \
              --parallel "$(nproc)"

      - name: Test
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            ${{ env.DOCKER_IMAGE }} \
            ctest \
              --test-dir /workspace/build-ci \
              --output-on-failure

  sanitizers:
    name: Sanitizers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: clang21-asan-ubsan
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              -S /workspace \
              -B /workspace/build-sanitizers \
              -G Ninja \
              -DCMAKE_C_COMPILER=clang-21 \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_GODOT_EXTENSION=OFF \
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build tests
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              --build /workspace/build-sanitizers \
              --target karkinolution_tests \
              --target karkinolution_app \
              --parallel "$(nproc)"

      - name: Test with sanitizers
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e ASAN_OPTIONS=detect_leaks=1:abort_on_error=1 \
            -e UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
            ${{ env.DOCKER_IMAGE }} \
            ctest \
              --test-dir /workspace/build-sanitizers \
              --output-on-failure

  godot-extension:
    name: Godot Extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: godot-clang21
          max-size: 1G

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.ci
          tags: ${{ env.DOCKER_IMAGE }}
          load: true
          cache-from: type=gha,scope=karkinolution-ci
          cache-to: type=gha,mode=max,scope=karkinolution-ci

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              -S /workspace \
              -B /workspace/build-godot \
              -G Ninja \
              -DCMAKE_C_COMPILER=clang-21 \
              -DCMAKE_CXX_COMPILER=clang++-21 \
              -DCMAKE_C_COMPILER_LAUNCHER=ccache \
              -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
              -DCMAKE_BUILD_TYPE=Debug \
              -DBUILD_GODOT_EXTENSION=ON

      - name: Build Godot extension
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/workspace" \
            -e CCACHE_DIR=/workspace/.ccache \
            ${{ env.DOCKER_IMAGE }} \
            cmake \
              --build /workspace/build-godot \
              --target karkinolution_godot \
              --parallel "$(nproc)"
