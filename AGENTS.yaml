version: "1.0"
project: "Karkino / Karkinolution (Karkino is an abbreviation)"

# Mandatory reading order for incoming agents before performing any work
workflow:
  required_reading:
    - file: "CONTRIBUTING.md"
      purpose: "Commit message conventions: type(scope): imperative description."
    - file: "docs/rules.md"
      purpose: "Core architectural boundaries, naming, model/physiology/motor, comments, doc standards."
    - file: "docs/commands.md"
      purpose: "Presets and build/test/run commands."
    - file: "docs/VISION.md"
      purpose: "Project goals, simulation focus, and the boundary between simulation and visualization."
    - file: "docs/skills/"
      purpose: "Operational skills that govern development and agent behavior."
    - file: "docs/SDK.md"
      purpose: "Public SDK boundary, client lifecycle, request behavior, and supported integration model."
    - file: "src/karkinolution/CONVENTIONS.md"
      purpose: "Project-wide naming, units, numeric types, and client/simulator responsibilities."
    - file: "src/karkinolution/binary/BINARY_CONVENTIONS.md"
      purpose: "SRI/DSI structure, binary layouts, offset responsibility, and protocol test requirements."
    - file: "src/karkinolution/networking/sdk/SDK_CONVENTIONS.md"
      purpose: "SDK interpreter structure, namespaces, request flow, and error handling."
    - file: "src/karkinolution/view/CONVENTIONS.md"
      purpose: "View namespace conventions and rendering-boundary rules."
    - file: "src/karkinolution/view/gui/README.md"
      purpose: "GUI architecture and rendering dependency boundaries."
    - file: "src/karkinolution/view/gui/components/README.md"
      purpose: "GUI component invariants, immutable geometry, and component state rules."
    - file: "src/karkinolution/view/gui/geometry/README.md"
      purpose: "Geometric center, extent, containment, and intersection conventions."
    - file: "src/karkinolution/view/gui/panel/README.md"
      purpose: "Panel ownership, quadtree consistency, collision queries, and rendering responsibilities."
    - file: "tests/HOW_TO_CREATE_TESTS.md"
      purpose: "Test purpose, organization, and verification requirements."
    - file: "src/karkinolution/api/HOW_TO_CREATE_API.md"
      purpose: "Architecture and verification requirements for client-accessible APIs."
  principles:
    - rule: "Document every architectural or protocol decision in the relevant documentation file before or alongside code implementation."
    - rule: "Document the rationale behind architectural decisions and the stable principles they protect. Do not record transient implementation facts, and do not duplicate source code in documentation."
    - rule: "Read and modify one file at a time rather than mass-reading entire directory trees."
    - rule: "Always separate tests into distinct files when testing different domain levels or concerns."
    - rule: "Run code quality formatting and tidy fixes on modified files prior to finalizing changes."
    - rule: "Comments must be concise; never use decorative ASCII banners or decorative separators."

# Hard agent boundaries that cannot be violated
boundaries:
  compilation_and_tests:
    allowed: true
    rule: "Agents must build the debug, sanitizers, and view-debug presets, and run the complete test suite. If concurrency-related code is changed, agents must also build the tsan preset and run the complete test suite with ThreadSanitizer."
  requirements:
    uncertainty: "Never assume. Ask the active programmer clarifying questions when in doubt."
  language: "English only for all code, comments, documentation, and commits."

git:
  commits: "Must strictly follow CONTRIBUTING.md."
